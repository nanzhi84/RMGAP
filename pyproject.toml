[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rmgap"
version = "1.0.0"
authors = [
    { name = "Yangyang Zhou" },
]
description = "RMGAP: Benchmarking the Generalization of Reward Models across Diverse Preferences."
dependencies = [
    "hydra-core",
    "loguru",
    "numpy",
    "omegaconf",
    "openai",
    "pydantic",
    "pyyaml>=6.0",
    "tqdm",
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

[project.optional-dependencies]
eval = [
    "sglang[all]",
    "torch",
    "transformers",
    "accelerate",
]
build = [
    "pandas>=2.0.0",
    "pyarrow>=10.0.0",
    "scikit-learn>=1.3.0",
    "sentence-transformers>=2.2.0",
    "sympy>=1.12",
    "mpmath>=1.3.0",
    "torch",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["rmgap*"]

[tool.setuptools.package-data]
"rmgap.cli" = ["config/**/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
