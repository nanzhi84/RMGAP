[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rmeval"
version = "1.0.0"
authors = [
    { name = "Yoryon", email = "nanzhi84@gmail.com" },
]
description = "RMEval: An efficient framework for reward model evaluation."
dependencies = [
    "hydra-core",
    "loguru",
    "numpy",
    "omegaconf",
    "openai",
    "sglang[all]",
    "torch",
    "tqdm",
    "transformers",
]
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
include = ["rmeval*"]

[tool.setuptools.package-data]
"rmeval.cli" = ["config/**/*.yaml"]
